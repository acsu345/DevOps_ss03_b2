server {
    listen 80;
    listen [::]:80;

    server_name 221.121.3.71 _;

    root /var/www/my-web/html;
    index index.html index.htm;

    # Basic static site routing
    location / {
        try_files $uri $uri/ =404;
    }

    # Custom Error Page directive for 404 Not Found
    error_page 404 /404.html;

    # Restrict direct access to /404.html using internal directive
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    # Custom log files
    access_log /var/log/nginx/my-web.access.log;
    error_log /var/log/nginx/my-web.error.log;
}
